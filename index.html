let audioCtx = null;
function sfx(kind) {
  if (!settings.sfx) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ac = audioCtx, now = ac.currentTime;
    const noise = (t, dur, freq, vol) => {
      const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 2.5;
      const g = ac.createGain(); g.gain.value = vol;
      src.connect(f).connect(g).connect(ac.destination); src.start(now + t);
    };
    const tone = (t, freq, dur, vol, type = "sine") => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, now + t); g.gain.linearRampToValueAtTime(vol, now + t + .02); g.gain.exponentialRampToValueAtTime(.0001, now + t + dur);
      o.connect(g).connect(ac.destination); o.start(now + t); o.stop(now + t + dur + .05);
    };
    if (kind === "dice") [0, .07, .15, .26, .4].forEach((t, i) => noise(t, .06, 1800 + i * 300, .5 - i * .07));
    if (kind === "crit") { [523, 659, 784, 1047].forEach((f, i) => tone(.05 + i * .08, f, .7, .12, "triangle")); }
    if (kind === "fumble") { tone(0, 180, .5, .15, "sawtooth"); tone(.12, 120, .6, .12, "sawtooth"); }
    if (kind === "level") { [392, 523, 659, 784, 1047].forEach((f, i) => tone(i * .11, f, 1.1, .1, "triangle")); }
    if (kind === "combat") { noise(0, .35, 220, .7); tone(0, 98, .8, .18, "sawtooth"); tone(.18, 73, .9, .15, "sawtooth"); }
  } catch {}
}

function renderLog(mode) {

      }

      case "roll": return `<div class="e"><span class="e roll">🎲 ${esc(e.text).replace("natural 20!", '<span class="crit">natural 20!</span>').replace("natural 1.", '<span class="fumble">natural 1.</span>')}</span></div>`;

  },

  method: el => { draft.method = el.dataset.m; if (draft.method === "roll") act.reroll(); else { if (draft.method === "array") draft.pool = [15, 14, 13, 12, 10, 8]; autoAssign(); renderCreator(); } },
  reroll: () => { draft.pool = Array.from({ length: 6 }, () => { const r = [rnd(6), rnd(6), rnd(6), rnd(6)].sort((a, b) => a - b); return r[1] + r[2] + r[3]; }); autoAssign(); renderCreator(); },
  autoassign: () => { if (draft.method === "pointbuy") draft.pb = Object.fromEntries(ABILITIES.map(a => [a, 8])), (() => { const o = suggestOrder(draft.cls); [15, 14, 13, 12, 10, 8].forEach((v, i) => draft.pb[o[i]] = v); const cost = ABILITIES.reduce((t, a) => t + PB_COST[draft.pb[a]], 0); if (cost > 27) { draft.pb[o[0]] = 15; draft.pb[o[1]] = 15; draft.pb[o[2]] = 15; draft.pb[o[3]] = 8; draft.pb[o[4]] = 8; draft.pb[o[5]] = 8; } })(); else autoAssign(); renderCreator(); },
  pb: el => { const a = el.dataset.a, v = draft.pb[a] + +el.dataset.v; if (v < 8 || v > 15) return; const old = draft.pb[a]; draft.pb[a] = v; const spent = ABILITIES.reduce((t, x) => t + PB_COST[draft.pb[x]], 0); if (spent > 27) { draft.pb[a] = old; toast("Out of points."); return; } renderCreator(); },
  skill: el => { const s = el.dataset.s, c = CLASSES[draft.cls]; if (draft.skills.includes(s)) draft.skills = draft.skills.filter(x => x !== s); else if (draft.skills.length < c.n) draft.skills.push(s); else { toast(`You can pick ${c.n}. Tap one to drop it first.`); return; } renderCreator(); },
  portrait: el => withBtn(el, async () => { draft.portraitId = await portraitFor({ ...draft }, true); renderCreator(); }),
  aiBackstory: el => withBtn(el, async () => {
    const t = await aiComplete("You help players write D&D character backstories: vivid, specific, 2 short paragraphs, leaving open threads a DM can use. No purple prose.",
      `${draftSummary()}${draft.backstory ? "\nThe player's own notes to build on (keep their ideas): " + draft.backstory : ""}\nWrite the backstory (max 170 words). Plain text.`, 700);
    draft.backstory = t.trim(); renderCreator(); }),
  aiFeatures: el => withBtn(el, async () => { await aiFeatures(); renderCreator(); }),
  aiHook: el => withBtn(el, async () => {
    const t = await aiComplete("You pitch D&D campaign hooks. One tight paragraph, specific and intriguing, with a clear first goal.",
      `Setting: ${worldSetting()}\nTone: ${draft.tone}\nHero: ${draftSummary()}\nBackstory: ${draft.backstory || "none"}\nWrite a hook (max 80 words) that ties to the hero.`, 400);
    draft.hook = t.trim(); renderCreator(); }),
  genParty: el => withBtn(el, async () => {
    const n = +draft.partySize;
    const t = await aiComplete("You design balanced D&D 5e adventuring parties. Reply with ONLY valid JSON, no commentary.",
      `The player is ${draftSummary()}\nSetting: ${worldSetting()}\nCreate ${n} level 1 companion${n > 1 ? "s" : ""} to form a well-rounded party with the player. Rules: every companion has a different class from each other and from the player (${draft.cls}); together cover the roles the party is missing (frontline, healer/support, damage, skills/utility); use varied species; distinct personalities with a flaw; realistic level 1 HP and AC.
JSON: {"companions":[{"name":"","species":"","cls":"","role":"short role e.g. Healer","personality":"one sentence","look":"one sentence visual description","maxHp":0,"ac":0,"hook":"one sentence tying them to the adventure"}]}`, 1200);
    const j = parseJSONLoose(t);
    draft.party = (j.companions || []).slice(0, n).map(c => ({ id: uid(), name: c.name, species: c.species, cls: c.cls, role: c.role, personality: c.personality, look: c.look, maxHp: +c.maxHp || 10, hp: +c.maxHp || 10, ac: +c.ac || 12, hook: c.hook, portraitId: null }));
    renderCreator(); }),
  partyPortraits: el => withBtn(el, async () => {
    await Promise.all(draft.party.filter(c => !c.portraitId).map(async c => { c.portraitId = await portraitFor(c); }));
    renderCreator(); }),
  begin: el => withBtn(el, beginAdventure),
  // play
  tab: el => { playTab = el.dataset.t; const P = $("#play"); P.dataset.tab = playTab; $$(".tabbar button").forEach(b => b.classList.toggle("on", b.dataset.t === playTab)); if (playTab === "story") updateJump(); },
  jump: () => { const S = $("#scroll"); S.scrollTo({ top: S.scrollHeight, behavior: reducedMotion() ? "auto" : "smooth" }); },
  more: () => { logShown += 50; renderLog("keep"); },
  sheetgo: el => { const t = document.getElementById(el.dataset.t); if (!t) return; if (t.tagName === "DETAILS") t.open = true; t.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" }); },
  send: sendSay,
  sugg: el => { if (!busy) takeTurn(el.textContent.trim()); },
  proll: el => doPendingRoll(el.dataset.id),
  adv: el => { advMode = +el.dataset.v; $$("[data-act=adv]").forEach(b => b.classList.toggle("on", +b.dataset.v === advMode)); },
  retry: retryLast,
  hush: () => "speechSynthesis" in window && speechSynthesis.cancel(),
  hp: el => { const p = game.pc; p.hp = clamp(p.hp + +el.dataset.v, 0, p.maxHp); saveGame(game); renderSheet(); },
  levelup: levelUp,
  rollab: el => { const a = el.dataset.a, b = modOf(game.pc.scores[a]); freeRoll("1d20" + (b >= 0 ? "+" : "") + b, AB_NAMES[a] + " check"); },
  rollsave: el => { const a = el.dataset.a, b = pcSaveBonus(game.pc, a); freeRoll("1d20" + (b >= 0 ? "+" : "") + b, AB_NAMES[a] + " save"); },
  rollskill: el => { const s = el.dataset.s, b = pcSkillBonus(game.pc, s); freeRoll("1d20" + (b >= 0 ? "+" : "") + b, s + " check"); },
  rmcond: el => { game.pc.conditions = game.pc.conditions.filter(c => c !== el.dataset.c); saveGame(game); renderSheet(); },
  rmitem: el => { game.pc.inventory.splice(+el.dataset.i, 1); saveGame(game); renderSheet(); },
  additem: () => { const v = $("#newItem").value.trim(); if (!v) return; game.pc.inventory.push(v); saveGame(game); renderSheet(); },
  setgold: () => { game.pc.gold = Math.max(0, +$("#goldIn").value || 0); saveGame(game); renderSheet(); toast("Gold updated."); },
  pdf: el => withBtn(el, async () => { await exportCharacterPDF(); toast("Character sheet downloaded."); }),
  shortrest: shortRest, longrest: longRest, deathsave: deathSave,
  inspire: () => { const p = game.pc; if (!p.inspiration) { toast("The DM awards Inspiration for great roleplay and clever ideas."); return; } p.inspiration = false; advMode = 1; syncAdv(); chron("Spent Inspiration"); saveGame(game); renderSheet(); toast("Inspiration spent: your next d20 roll has advantage."); },
  pcportrait: el => withBtn(el, async () => { const id = await portraitFor(game.pc, true); game.pc.portraitId = id; game.gallery.push({ id, caption: game.pc.name, kind: "portrait" }); saveGame(game); renderSheet(); }),
  cportrait: el => withBtn(el, async () => { const c = game.party.find(x => x.id === el.dataset.id); if (!c) return; const id = await portraitFor(c); c.portraitId = id; game.gallery.push({ id, caption: c.name, kind: "portrait" }); saveGame(game); renderRight(); }),
  scene: () => illustrateScene(false),
  map: el => makeMap(el.dataset.t, false),
  maptoggle: () => { mapState.open = !mapState.open; renderMapPanel(); },
  mapfull: () => { mapState.full = !mapState.full; renderMapPanel(); },
  mapredraw: () => buildBattleMap(false),
  pip: el => { const p = game.pc, l = +el.dataset.l, k = +el.dataset.k2, used = p.slotsUsed[l] || 0; p.slotsUsed[l] = k < used ? k : k + 1; saveGame(game); renderSheet(); },
  atk: el => { const a = game.pc.attacks[+el.dataset.i]; const b = parseInt(String(a.hit).replace(/[^\d-]/g, "")) || 0; freeRoll("1d20" + (b >= 0 ? "+" : "") + b, a.name + " attack"); },
  dmg: el => { const a = game.pc.attacks[+el.dataset.i]; const n = (String(a.dmg).match(/\d*d\d+(\s*[+-]\s*\d+)?/i) || ["1d4"])[0].replace(/\s/g, ""); freeRoll(n, a.name + " damage"); },
  refreshSheet: el => withBtn(el, () => refreshSheetAI("begin")),
  journal: () => openCodex(),
  lore: el => openCodex(null, el.dataset.id),
  entry: el => openEntry(el.dataset.id),
  codexTab: el => openCodex(el.dataset.t),
  codexBack: () => openCodex(),
  notebook: revealNotebook,
  memRebuild: el => withBtn(el, async () => { await maybeSummarize(true); const n = await buildCodexFromStory(game); toast(n ? `Found ${n} things to remember.` : "Nothing new to remember."); openCodex(); renderPlayAll(); }),
  addQuest: () => { const v = $("#newQuest").value.trim(); if (!v) return; applyQuests(game, [{ name: v, status: "active", note: "Set by you" }]); game.log.push({ id: uid(), role: "system", forAI: true, text: `The player set a personal goal: ${v}` }); saveGame(game); openCodex("quests"); renderRight(); },
  addNote: () => { const v = $("#newNote").value.trim(); if (!v) return; addPlayerNotes([v]); openCodex("you"); },
  rmNote: el => { const t = tableMem(); t.forgotten = [...(t.forgotten || []), el.dataset.id]; t.notes = t.notes.filter(n => n.id !== el.dataset.id); saveTableMem(t); openCodex("you"); },
  newEntry: () => { const type = codexTab === "lore" ? "lore" : codexTab; const ch = rememberEntries(game, [{ type, name: "New " + (type === "npc" ? "person" : type), summary: "" }]); saveGame(game); if (ch[0]) openEntry(ch[0].e.id); },
  delEntry: el => { if (!confirm("Forget this for good? The DM won't remember it either.")) return; const e = game.codex.find(x => x.id === el.dataset.id); game.codex = game.codex.filter(x => x.id !== el.dataset.id); saveGame(game); renderLog(); openCodex(e && ["item", "lore", "event"].includes(e.type) ? "lore" : e?.type); },
  paintEntry: el => withBtn(el, async () => {
    const e = game.codex.find(x => x.id === el.dataset.id); if (!e) return;
    const kind = e.type === "npc" ? "Head-and-shoulders character portrait of" : e.type === "place" ? "Wide establishing view of" : e.type === "item" ? "Detailed still-life of the item" : "Heraldic emblem of";
    e.portraitId = await generateImage(`${ART_STYLE} ${kind} ${e.name}: ${e.summary}. ${e.facts.slice(-3).join(". ")}. Setting: ${game.world.setting}`, e.type === "place" ? "wide" : "square");
    game.gallery.push({ id: e.portraitId, caption: e.name, kind: e.type }); saveGame(game); openEntry(e.id);
    if (lastImageNote) toast(lastImageNote, 7000); }), gallery: openGallery, export: exportSave,
  die: el => { const n = el.dataset.n; freeRoll(n.includes("d") ? n : "1d" + n, n.includes("d") ? n : "d" + n); },
  customroll: () => { const v = $("#customRoll").value.trim(); if (!/\d*d\d+/i.test(v)) { toast("Write a roll like 2d6+3."); return; } freeRoll(v, v); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = act[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".skillrow[data-act]")) { e.preventDefault(); act[e.target.dataset.act](e.target); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.actChange === "assign") {
    const a = el.dataset.a, idx = +el.value, holder = ABILITIES.find(x => x !== a && draft.assign[x] === idx);
    if (holder) draft.assign[holder] = draft.assign[a];
    draft.assign[a] = idx; renderCreator();
  }
  if (el.id === "upPortrait" && el.files[0]) {
    const fr = new FileReader();
    fr.onload = async () => { const small = await downscale(fr.result, 768); const id = "img_" + uid(); await IDB.put(id, small); imgCache.set(id, small); draft.portraitId = id; renderCreator(); };
    fr.readAsDataURL(el.files[0]);
  }
});
$("#homeBtn").onclick = () => act.home();
$("#settingsBtn").onclick = openSettings;
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
window.addEventListener("beforeunload", () => { if (game) saveGame(game); });
migrateSaves().finally(() => { renderHome(); if (syncOn()) syncNow(); });
</script>
</body>
</html>
