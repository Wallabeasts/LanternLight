<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanternlight — AI Dungeon Master</title>
<meta name="description" content="Play full D&D campaigns with an AI Dungeon Master: character creation, dice, animated battle maps, portraits, and a DM that remembers your story.">
<meta property="og:title" content="Lanternlight — AI Dungeon Master">
<meta property="og:description" content="Build a hero, gather a party, and play D&D with an AI Dungeon Master.">
<meta name="theme-color" content="#171c28">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171c28; --slate:#222a3a; --slate2:#2c3548; --line:#3a4560;
  --parch:#eee1c2; --parch2:#e2d2ac; --parch-ink:#2b2118; --parch-mute:#6b5a43;
  --wax:#9e2a2b; --wax-hi:#b8393a; --brass:#c9a45c; --mist:#a9b2c4; --text:#e9e6de;
  --good:#6f9a5b; --bad:#c0504d;
  --serif:"IM Fell English", Georgia, "Times New Roman", serif;
  --sc:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --sans:"Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:17px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0 0 .4em;line-height:1.15}
h2{font-size:1.7rem} h3{font-size:1.25rem}
.muted{color:var(--mist)} .small{font-size:.88rem}
.hidden{display:none!important}

/* buttons */
.btn{border:1px solid var(--line);background:var(--slate2);padding:.5em .9em;border-radius:6px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--brass)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--wax);border-color:var(--wax);color:#fff4ea}
.btn.primary:hover{background:var(--wax-hi)}
.btn.ghost{background:transparent}
.btn.sm{padding:.3em .6em;font-size:.88rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* forms */
label.f{display:block;margin:.6rem 0}
label.f>span{display:block;font-size:.88rem;color:var(--mist);margin-bottom:.25rem}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.5em .6em}
textarea{resize:vertical;min-height:5em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}}
.check{display:flex;gap:.5rem;align-items:center;margin:.4rem 0;cursor:pointer}

/* top bar */
#topbar{display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem;border-bottom:1px solid var(--line);background:var(--slate)}
#topbar .brand{font-family:var(--sc);font-size:1.3rem;color:var(--brass);cursor:pointer;background:none;border:0;padding:0}
#topbar .where{font-size:.9rem;color:var(--mist);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
#topbar .where b{color:var(--text);font-weight:500}

main{height:calc(100% - 52px)}
.page{max-width:880px;margin:0 auto;padding:1.5rem 1rem 4rem;height:100%;overflow:auto}

/* home */
.hero{padding:3rem 0 2rem}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);color:var(--parch);margin-bottom:.2em}
.hero p{max-width:34em;color:var(--mist);font-size:1.1rem}
.saves{margin-top:1.5rem;border-top:1px solid var(--line)}
.save{display:flex;gap:1rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--line)}
.save img,.save .noimg{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--slate2);flex:none}
.save .info{flex:1;min-width:0}
.save .info b{font-family:var(--serif);font-size:1.2rem;font-weight:400}

/* creator */
.steps{display:flex;gap:.25rem;margin:0 0 1.2rem;flex-wrap:wrap}
.steps button{background:none;border:0;border-bottom:2px solid var(--line);padding:.4em .6em;cursor:pointer;color:var(--mist)}
.steps button.on{color:var(--parch);border-color:var(--brass)}
.panel{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.ab{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.6rem;text-align:center}
.ab .n{font-size:.85rem;color:var(--mist)}
.ab .v{font-family:var(--serif);font-size:1.9rem;line-height:1.1}
.ab .m{color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line);border-radius:999px;padding:.25em .7em;background:var(--ink);cursor:pointer;font-size:.92rem}
.chip.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.chip.lock{opacity:.7;cursor:default}
.portrait{width:160px;height:160px;border-radius:10px;object-fit:cover;background:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:.85rem;text-align:center;flex:none}
.comp{display:flex;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line)}
.comp:first-child{border-top:0}
.comp .portrait{width:72px;height:72px;border-radius:50%}

/* play layout */
.play{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;height:100%}
.side{background:var(--slate);overflow:auto;padding:1rem}
.side.left{border-right:1px solid var(--line)} .side.right{border-left:1px solid var(--line)}
.center{display:flex;flex-direction:column;min-height:0;background:#1c2231}
.tabbar{display:none}
@media (max-width:1000px){
  .play{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .play>.side,.play>.center{display:none;grid-row:1}
  .play[data-tab=story]>.center,.play[data-tab=sheet]>.left,.play[data-tab=party]>.right{display:flex;flex-direction:column}
  .play[data-tab=sheet]>.left,.play[data-tab=party]>.right{display:block}
  .tabbar{display:flex;grid-row:2;border-top:1px solid var(--line);background:var(--slate)}
  .tabbar button{flex:1;background:none;border:0;padding:.7rem 0;color:var(--mist);cursor:pointer}
  .tabbar button.on{color:var(--brass)}
}

/* the scroll — the one bold thing */
.scroll{flex:1;overflow:auto;padding:1.2rem clamp(.8rem,3vw,2.2rem) 1rem}
.parchment{max-width:46rem;margin:0 auto;background:var(--parch);color:var(--parch-ink);border-radius:4px;
  padding:1.6rem clamp(1rem,4vw,2.6rem) 2rem;
  box-shadow:0 0 0 1px #c9b68c, 0 18px 40px rgba(0,0,0,.45), inset 0 0 90px rgba(120,84,30,.22);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(140,100,40,.18),transparent 55%)}
.e{margin:0 0 1.1rem}
.e.dm{font-family:var(--serif);font-size:1.16rem;line-height:1.62}
.e.dm p{margin:0 0 .75em}
.e.dm:first-of-type p:first-child::first-letter{float:left;font-size:3.4em;line-height:.85;padding:.06em .08em 0 0;color:var(--wax)}
.e.player{border-left:3px solid var(--wax);padding:.2rem 0 .2rem .8rem;font-family:var(--sans);color:#3a2d20}
.e.player .who{font-size:.8rem;color:var(--parch-mute)}
.e.roll{font-family:var(--sans);font-size:.95rem;color:#3a2d20;background:var(--parch2);display:inline-block;padding:.3em .7em;border-radius:5px}
.e.roll .crit{color:var(--good);font-weight:700} .e.roll .fumble{color:var(--bad);font-weight:700}
.e.system{font-family:var(--sans);font-size:.88rem;color:var(--parch-mute);text-align:center;font-style:italic}
.e.error{font-family:var(--sans);font-size:.92rem;color:#fff;background:var(--bad);padding:.5rem .8rem;border-radius:6px}
.e figure{margin:0}
.e figure img{width:100%;border-radius:4px;display:block;cursor:zoom-in;box-shadow:0 0 0 1px #b9a57b}
.e figcaption{font-size:.82rem;color:var(--parch-mute);font-style:italic;margin-top:.3rem;font-family:var(--serif)}
.cursor::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--wax)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}

.actionbar{border-top:1px solid var(--line);padding:.6rem clamp(.6rem,3vw,2rem) .8rem;background:var(--slate)}
.actionbar .inner{max-width:46rem;margin:0 auto}
.sugg{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.sugg button{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.3em .8em;cursor:pointer;font-size:.9rem;text-align:left}
.sugg button:hover{border-color:var(--brass)}
.rollreq{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem;align-items:center}
.rollreq button{background:var(--wax);border:0;color:#fff;border-radius:6px;padding:.45em .8em;cursor:pointer}
.rollreq button.done{background:var(--good)}
.composer{display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{min-height:2.7em;max-height:9em;flex:1}
.advtoggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.advtoggle button{background:var(--ink);border:0;padding:.3em .6em;cursor:pointer;font-size:.85rem;color:var(--mist)}
.advtoggle button.on{background:var(--brass);color:var(--ink)}

/* sheet */
.sheethead{display:flex;gap:.8rem;align-items:center;margin-bottom:.8rem}
.sheethead img,.sheethead .portrait{width:78px;height:78px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.6rem 0}
.stats .ab{padding:.35rem}
.stats .ab .v{font-size:1.35rem}
.hpbar{height:10px;border-radius:5px;background:var(--ink);overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.hpbar i.low{background:var(--bad)}
.kv{display:flex;justify-content:space-between;padding:.2rem 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.sec{margin-top:1rem}
.sec>h3{font-size:1.05rem;color:var(--brass);margin-bottom:.35rem}
.list{margin:0;padding-left:1.1rem;font-size:.93rem}
.skillrow{display:flex;justify-content:space-between;font-size:.9rem;padding:.1rem 0;cursor:pointer}
.skillrow:hover{color:var(--brass)}
.skillrow .p{color:var(--brass)}
.member{display:flex;gap:.6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.member img,.member .portrait{width:48px;height:48px;border-radius:50%;font-size:.6rem}
.member .info{flex:1;min-width:0}
.enemy{padding:.4rem 0;border-bottom:1px solid var(--line)}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.dice button{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.45em 0;cursor:pointer}
.dice button:hover{border-color:var(--brass)}
.lastroll{font-family:var(--serif);font-size:1.6rem;text-align:center;margin:.4rem 0}

/* modal */
#modal{position:fixed;inset:0;background:rgba(8,10,16,.75);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
#modal .box{background:var(--slate);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:1.2rem 1.3rem}
#modal .box.wide{max-width:980px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:zoom-in}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--parch);color:var(--parch-ink);padding:.55em 1em;border-radius:8px;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw}
.spin{display:inline-block;width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-.15em}
@keyframes sp{to{transform:rotate(360deg)}}

/* map */
#mapwrap{border-bottom:1px solid var(--line);background:#12161f;padding:.4rem clamp(.5rem,2vw,1.2rem) .6rem}
#mapwrap.full{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;padding-top:calc(.5rem + env(safe-area-inset-top,0px));padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px))}
#mapwrap.full .mapbody{flex:1}
.maphead{display:flex;align-items:center;gap:.5rem;width:100%;max-width:62rem;margin:0 auto .35rem}
.maphead .btn{white-space:nowrap}
.mapname{font-family:var(--serif);font-size:1.1rem;color:var(--parch);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mapbody{display:flex;flex-direction:column;align-items:center;width:100%;max-width:62rem;margin:0 auto;min-height:0}
#mapwrap.full .maphead,#mapwrap.full .mapbody{max-width:none}
#mapc{border-radius:6px;box-shadow:0 0 0 1px #3a4560,0 10px 30px rgba(0,0,0,.5);touch-action:none;cursor:grab;max-width:100%}
.maptip{min-height:1.3em;font-size:.85rem;color:var(--mist);margin-top:.3rem;text-align:center}
/* living images */
.living{position:relative;overflow:hidden;border-radius:4px}
.living img{animation:kenburns 38s ease-in-out infinite alternate;transform-origin:50% 60%}
.living::after{content:"";position:absolute;inset:-20%;pointer-events:none;
  background:radial-gradient(ellipse 30% 18% at 20% 30%,rgba(255,255,255,.10),transparent 70%),radial-gradient(ellipse 25% 15% at 70% 60%,rgba(255,255,255,.08),transparent 70%),radial-gradient(ellipse 35% 20% at 45% 85%,rgba(255,255,255,.07),transparent 70%);
  animation:drift 46s linear infinite}
.living.map::after{background:radial-gradient(ellipse 22% 14% at 25% 35%,rgba(40,30,20,.22),transparent 70%),radial-gradient(ellipse 28% 16% at 75% 55%,rgba(40,30,20,.18),transparent 70%),radial-gradient(ellipse 20% 12% at 50% 15%,rgba(255,255,255,.14),transparent 70%)}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.09) translate(-2%,-1.5%)}}
@keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
/* dice */
#diceFx{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(10,12,20,.55),transparent 60%)}
#diceFx .die{position:relative;width:150px;height:150px;animation:tumble .6s cubic-bezier(.2,.8,.3,1)}
#diceFx svg{width:100%;height:100%;fill:#2b1d3a;stroke:var(--brass);stroke-width:2.2;stroke-linejoin:round}
#diceFx svg .inner{fill:#3b2850}
#diceFx .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:14px;font-family:var(--serif);font-size:2.6rem;color:#fff4dc}
#diceFx .dlabel{margin-top:.6rem;font-family:var(--serif);font-size:1.2rem;color:var(--parch);text-shadow:0 2px 8px #000}
#diceFx.landed .die{animation:land .35s ease-out}
#diceFx.crit svg{fill:#5a4212;stroke:#ffe08a;filter:drop-shadow(0 0 18px #ffd35a)}
#diceFx.crit .num{color:#fff3c0}
#diceFx.fumble svg{fill:#3a1212;stroke:#e0524a;filter:drop-shadow(0 0 14px #b8393a)}
#diceFx.fumble .die{animation:shake .4s}
@keyframes tumble{from{transform:rotate(-540deg) scale(.2);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
@keyframes land{0%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}
/* title card */
#titleCard{position:fixed;inset:0;z-index:64;display:flex;align-items:center;justify-content:center;pointer-events:none}
#titleCard .tc-inner{text-align:center;opacity:0;padding:2rem 3rem;background:radial-gradient(ellipse at center,rgba(10,12,20,.85),rgba(10,12,20,0) 70%)}
#titleCard h1{font-size:clamp(2.4rem,7vw,4.4rem);color:var(--parch);margin:.3rem 0;letter-spacing:.02em}
#titleCard p{font-family:var(--serif);font-style:italic;color:var(--brass);font-size:1.15rem;margin:0}
#titleCard .tc-rule{height:1px;width:0;margin:0 auto;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
#titleCard.show .tc-inner{animation:tc 3.2s ease forwards}
#titleCard.show .tc-rule{animation:rule 3.2s ease forwards}
@keyframes tc{0%{opacity:0;transform:translateY(8px)}15%,78%{opacity:1;transform:none}100%{opacity:0}}
@keyframes rule{0%{width:0}30%,100%{width:min(420px,70vw)}}
/* sheet progression */
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:rgba(201,164,92,.45)}100%{background:transparent}}
.hpfloat{position:absolute;right:0;top:-.4rem;font-weight:700;font-size:1.3rem;animation:hpf 1.5s ease-out forwards;pointer-events:none}
.hpfloat.down{color:#ff6a5f}.hpfloat.up{color:#8fe07a}
@keyframes hpf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
#sheet.hurt{animation:hurt .5s}
@keyframes hurt{0%{box-shadow:inset 0 0 0 0 rgba(200,40,40,0)}30%{box-shadow:inset 0 0 60px 0 rgba(200,40,40,.45)}100%{box-shadow:inset 0 0 0 0 rgba(200,40,40,0)}}
.pips{display:flex;gap:.3rem;flex-wrap:wrap}
.pip{width:18px;height:18px;border-radius:50%;border:2px solid var(--brass);background:var(--brass);cursor:pointer;padding:0}
.pip.used{background:transparent}
.atk{display:flex;align-items:center;gap:.4rem;padding:.3rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.atk .nm{flex:1;min-width:0}
.chron{list-style:none;padding:0;margin:0;font-size:.88rem}
.chron li{padding:.2rem 0;border-bottom:1px dashed var(--line);color:var(--mist)}
.chron li:first-child{color:var(--text)}
.keylink{font-size:.82rem;color:var(--mist);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.keylink:hover{color:var(--brass)}
footer.foot{margin-top:3rem;font-size:.85rem;color:var(--mist)}
.deathbox{border:1px solid var(--bad);background:rgba(192,80,77,.12);border-radius:8px;padding:.6rem .7rem;margin:0 0 .7rem}
details.spend{margin:.4rem 0 .6rem}
details.spend summary{cursor:pointer;color:var(--mist);font-size:.9rem}
table.usage{border-collapse:collapse;font-size:.82rem;margin-top:.4rem;width:100%}
table.usage th,table.usage td{border-bottom:1px solid var(--line);padding:.25rem .4rem;text-align:left;white-space:nowrap}
/* easier scrolling */
.center{position:relative}
.jump{position:absolute;right:1rem;bottom:calc(var(--abh, 150px) + .6rem);z-index:5;background:var(--brass);color:var(--ink);border:0;border-radius:999px;padding:.45em .9em;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.sheetnav{position:sticky;top:-1rem;z-index:3;display:flex;gap:.3rem;overflow-x:auto;background:var(--slate);padding:.5rem 0;margin:-.5rem 0 .6rem;scrollbar-width:none}
.sheetnav .chip{flex:none;font-size:.82rem}
details.sec>summary{list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3::after{content:" ▾";color:var(--mist);font-size:.8em}
details.sec:not([open])>summary h3::after{content:" ▸"}
.sync-ok{color:var(--good)} .sync-bad{color:var(--bad)}
/* memory */
.lore{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-bottom:1px dotted var(--wax);line-height:inherit}
.lore:hover{color:var(--wax)}
.e.memo{font-family:var(--sans);font-size:.84rem;color:var(--parch-mute);border-top:1px dashed #c9b68c;padding-top:.4rem}
.e.memo>span{font-style:italic;margin-right:.2rem}
.e.memo sup{color:var(--wax);font-size:.7em;margin-left:.1em}
.entries{margin-top:.6rem}
.entry{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.6rem .2rem;cursor:pointer}
.entry:hover{background:var(--slate2)}

function calcAC(cls, sc) {
  const d = modOf(sc.DEX), c = modOf(sc.CON), w = modOf(sc.WIS);
  switch (CLASSES[cls]?.ac) {
    case "barb": return 10 + d + c;
    case "monk": return 10 + d + w;
    case "leather": return 11 + d;
    case "leatherShield": return 13 + d;
    case "scaleShield": return 16 + Math.min(d, 2);
    case "chainShield": return 18;
    default: return 10 + d;
  }
}

/* ============ dice ============ */
function rollNotation(notation, adv = 0) {
  // supports "2d6+3", "1d20-1", "d8", "3"
  const s = String(notation || "1d20").replace(/\s+/g, "").toLowerCase();
  const re = /([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;
  let m, total = 0, parts = [], nat = null, any = false;
  while ((m = re.exec(s))) {
    any = true;
    if (m[3]) {
      const sign = m[1] === "-" ? -1 : 1, n = Math.min(+m[2] || 1, 100), sides = +m[3];
      const rolls = [];
      for (let i = 0; i < n; i++) {
        if (sides === 20 && n === 1 && adv) {
          const a = rnd(20), b = rnd(20), pick = adv > 0 ? Math.max(a, b) : Math.min(a, b);
          rolls.push(pick); parts.push(`d20(${a}, ${b} → ${pick})`); nat = pick;
        } else { const r = rnd(sides); rolls.push(r); if (sides === 20 && n === 1) nat = r; }
      }
      const sum = rolls.reduce((a, b) => a + b, 0) * sign;
      total += sum;
      if (!(sides === 20 && n === 1 && adv)) parts.push(`${sign < 0 ? "−" : ""}${n}d${sides}(${rolls.join(", ")})`);
    } else if (m[5]) {
      const v = (m[4] === "-" ? -1 : 1) * +m[5];
      total += v; parts.push(v < 0 ? `− ${-v}` : `+ ${v}`);
    }
  }
  if (!any) return rollNotation("1d20", adv);
  return { total, detail: parts.join(" ").replace(/^\+ /, ""), nat };
}

/* ============ storage ============ */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("lanternlight", 2);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("images")) d.createObjectStore("images"); if (!d.objectStoreNames.contains("games")) d.createObjectStore("games"); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(key, val, store = "images") { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, "readwrite"); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  async get(key, store = "images") { const db = await this.open(); return new Promise((res) => { const q = db.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); },
  async del(key, store = "images") { const db = await this.open(); return new Promise((res) => { const t = db.transaction(store, "readwrite"); t.objectStore(store).delete(key); t.oncomplete = () => res(); t.onerror = () => res(); }); }
};
const imgCache = new Map();
async function imgURL(id) {
  if (!id) return null;
  if (imgCache.has(id)) return imgCache.get(id);
  const v = await IDB.get(id); if (v) imgCache.set(id, v); return v;
}
// Fill any <img data-img="id"> placeholders after render
async function hydrateImages(root = document) {
  for (const el of $$("img[data-img]", root)) {
    if (el.dataset.done) continue;
    const u = await imgURL(el.dataset.img);
    if (u) { el.src = u; el.dataset.done = 1; }
  }
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast("Couldn't save — browser storage is full or blocked."); return false; } }
};
const DEFAULT_SETTINGS = {
  provider: "anthropic", anthropicKey: "", anthropicModel: "claude-sonnet-5-5",
  openaiKey: "", openaiModel: "gpt-5", imageModel: "gpt-image-1", imageQuality: "medium",
  images: true, autoMap: true, autoScene: true, tts: false, voice: "",
  imageProvider: "auto", pollinationsKey: "", sfx: true, v2: true,
  keys: {}, models: {}, customBase: "", helperModels: {}, replyLength: "normal"
};
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("ll.settings", {}));
["anthropicKey", "openaiKey", "pollinationsKey"].forEach(k => settings[k] = cleanKey(settings[k]));
settings.keys = Object.assign({}, settings.keys); settings.models = Object.assign({}, settings.models); settings.helperModels = Object.assign({}, settings.helperModels);
if (!settings.v2) { Object.assign(settings, { imageProvider: "auto", autoScene: true, sfx: true, v2: true }); }
const saveSettings = () => { LS.set("ll.settings", settings); LS.set("ll.prefsUpdated", Date.now()); if (typeof scheduleSync === "function") scheduleSync(3000); };

function listSaves() { return LS.get("ll.saves", []); }
// Campaigns live in IndexedDB (room for very long campaigns); a small index lives in localStorage.
function saveGame(g, opts = {}) {
  if (!opts.keepTime) g.updated = Date.now();
  const meta = { id: g.id, title: g.title, name: g.pc.name, cls: g.pc.cls, level: g.pc.level, species: g.pc.species, portraitId: g.pc.portraitId, updated: g.updated, location: g.location || "" };
  const saves = listSaves().filter(s => s.id !== g.id); saves.unshift(meta);
  LS.set("ll.saves", saves);
  let snapshot; try { snapshot = JSON.parse(JSON.stringify(g)); } catch (e) { toast("Couldn't save: " + e.message); return; }
  IDB.put(g.id, snapshot, "games").catch(e => toast("Couldn't save your campaign: " + (e?.message || "storage error"), 6000));
  if (typeof updateLegend === "function") updateLegend(g);
  if (!opts.noSync && typeof scheduleSync === "function") scheduleSync();
}
async function loadGame(id) {
  let g = await IDB.get(id, "games").catch(() => null);
  if (!g) { g = LS.get("ll.game." + id, null); if (g) { await IDB.put(id, g, "games").catch(() => {}); } }
  return g;
}
// tombTime is set when the deletion came from another device.
async function deleteGame(id, tombTime) {
  const D = LS.get("ll.deleted", {}); D[id] = tombTime || Date.now(); LS.set("ll.deleted", D);
  const g = await loadGame(id);
  if (g) for (const k of allImageIds(g)) IDB.del(k);
  await IDB.del(id, "games"); localStorage.removeItem("ll.game." + id);
  LS.set("ll.saves", listSaves().filter(s => s.id !== id));
  const L = LS.get("ll.legends", {}); delete L[id]; LS.set("ll.legends", L);
  if (!tombTime && typeof scheduleSync === "function") scheduleSync(1000);
}
// One-time move of older saves out of localStorage
async function migrateSaves() {
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith("ll.game.")) continue;
    try { const g = JSON.parse(localStorage.getItem(k)); if (g?.id) { await IDB.put(g.id, g, "games"); localStorage.removeItem(k); } } catch {}
  }
}
function allImageIds(g) {
  const ids = new Set();
  if (g.pc.portraitId) ids.add(g.pc.portraitId);
  (g.party || []).forEach(p => p.portraitId && ids.add(p.portraitId));
  (g.log || []).forEach(e => e.imgId && ids.add(e.imgId));
  (g.gallery || []).forEach(x => ids.add(x.id));
  (g.codex || []).forEach(e => e.portraitId && ids.add(e.portraitId));
  return [...ids];
}

/* ============ AI: text ============ */
// Text AI providers. The free ones speak the same "chat completions" format as OpenAI.
const PROVIDERS = {

  openai: { name: "GPT (OpenAI)", paid: true, base: "https://api.openai.com/v1", keyUrl: "https://platform.openai.com/api-keys", noMaxTokens: true },
  gemini: { name: "Google Gemini — free tier", base: "https://generativelanguage.googleapis.com/v1beta/openai", keyUrl: "https://aistudio.google.com/apikey", keyHint: "AIza…",
    prefer: [/^gemini-[\d.]+-flash$/i, /^gemini-[\d.]+-flash(?!.*(lite|image|tts|live|audio|embed|thinking-exp))/i, /gemini.*flash(?!.*(image|tts|live|audio|embed))/i], fallback: "gemini-2.5-flash" },

    prefer: [/gpt-oss-120b/i, /llama-3\.3-70b/i, /llama-4/i, /qwen/i, /llama/i], fallback: "openai/gpt-oss-120b" },
  openrouter: { name: "OpenRouter — free models", base: "https://openrouter.ai/api/v1", keyUrl: "https://openrouter.ai/keys", keyHint: "sk-or-…", lean: true,
    prefer: [/deepseek.*:free$/i, /llama-3\.3-70b.*:free$/i, /qwen.*:free$/i, /gemma.*:free$/i, /:free$/i], fallback: "" },
  custom: { name: "Other (OpenAI-compatible)", base: "", keyUrl: "" }
};
const isChatCompat = p => p !== "anthropic";
function providerKey(p = settings.provider) { return p === "anthropic" ? settings.anthropicKey : p === "openai" ? settings.openaiKey : (settings.keys[p] || ""); }
function providerBase(p = settings.provider) { return p === "custom" ? String(settings.customBase || "").replace(/\/+$/, "") : PROVIDERS[p]?.base; }
function providerModel(p = settings.provider) { return p === "anthropic" ? settings.anthropicModel : p === "openai" ? settings.openaiModel : (settings.models[p] || ""); }
const DEFAULT_HELPERS = { anthropic: "claude-haiku-4-5-20251001" };
function helperModel(p = settings.provider) { return (settings.helperModels || {})[p] || DEFAULT_HELPERS[p] || providerModel(p); }
function setProviderModel(p, m) { if (p === "anthropic") settings.anthropicModel = m; else if (p === "openai") settings.openaiModel = m; else settings.models[p] = m; saveSettings(); }
// Free tiers have small per-minute token limits, so send a leaner prompt there.
const leanMode = () => !!PROVIDERS[settings.provider]?.lean;
function haveTextAI() { return !!providerKey() && (settings.provider !== "custom" || !!providerBase()); }
async function listModels(p = settings.provider) {
  const res = await fetchRetry(providerBase(p) + "/models", { headers: { authorization: "Bearer " + providerKey(p) } }, 2);
  const j = await res.json();
  return (j.data || j.models || []).map(m => String(m.id || m.name || "").replace(/^models\//, "")).filter(Boolean);
}
function pickModel(p, ids) {
  const P = PROVIDERS[p] || {};
  const ver = id => parseFloat((id.match(/(\d+(?:\.\d+)?)/) || [0, 0])[1]);
  for (const rx of P.prefer || []) {
    const hits = ids.filter(id => rx.test(id) && !/preview|exp/i.test(id));
    const any = hits.length ? hits : ids.filter(id => rx.test(id));
    if (any.length) return any.sort((a, b) => ver(b) - ver(a))[0];
  }
  return ids[0] || P.fallback || "";
}
async function autoModel(p = settings.provider) {
  let m = "";
  try { m = pickModel(p, await listModels(p)); } catch (e) { m = PROVIDERS[p]?.fallback || ""; }
  if (!m) throw new Error("Couldn't find a model for " + PROVIDERS[p].name + ". Type one into Settings.");
  setProviderModel(p, m);
  return m;
}
function haveImageAI() { return !!settings.images && (settings.imageProvider !== "openai" || !!settings.openaiKey); }
function imageSourceName() { return (settings.imageProvider === "openai" || (settings.imageProvider === "auto" && settings.openaiKey)) ? "OpenAI" : "the free painter"; }

async function apiError(res) {
  let msg = `HTTP ${res.status}`;
  try { const j = await res.json(); msg = j?.error?.message || j?.message || msg; } catch {}
  if (res.status === 401) msg += " — check your API key in Settings.";
  if (res.status === 429) msg += PROVIDERS[settings.provider]?.paid === false || !PROVIDERS[settings.provider]?.paid ? " — you've hit the free tier's limit. Wait a minute, or if it's a daily limit, until tomorrow." : " — rate limited or out of credit.";
  if (res.status === 529 || res.status === 503) msg += " — the service is overloaded. Try again in a minute.";
  if (res.status === 404 && /model/i.test(msg)) msg += " — check the model name in Settings.";
  return new Error(msg);
}

function badKeyMsg(url) { return `Your ${/anthropic/.test(url) ? "Anthropic" : "API"} key contains a character that can't be sent. Copy it again from the website and paste it into Settings.`; }
// Tell "no internet" apart from "this one site is blocked"
async function diagnoseBlock(url) {
  const host = new URL(url).hostname;
  if (navigator.onLine === false) return "You're offline. Check your internet connection.";
  let internetOk = false;
  try { await fetch("https://www.google.com/favicon.ico?t=" + Date.now(), { mode: "no-cors", cache: "no-store" }); internetOk = true; } catch {}
  if (!internetOk) try { await fetch("https://cdnjs.cloudflare.com/?t=" + Date.now(), { mode: "no-cors", cache: "no-store" }); internetOk = true; } catch {}
  return internetOk
    ? `Your internet works, but ${host} is being blocked. This is usually a school or work network filter, a school-managed device, or an ad or privacy blocker extension. Try another network (like a phone hotspot or home Wi-Fi), another device, or turn off blockers for this site.`
    : `Couldn't reach ${host}. Check your internet connection.`;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchRetry(url, opt, tries = 3) {
  for (let i = 0; ; i++) {
    let res;
    try { res = await fetch(url, opt); }
    catch (e) {
      if (/ISO-8859|header/i.test(e?.message || "")) throw new Error(badKeyMsg(url));
      if (i < tries - 1) { await sleep(1500 * (i + 1)); continue; }

async function downscale(dataUrl, max = 1024) {
  return new Promise(res => {
    const im = new Image(), safety = setTimeout(() => res(dataUrl), 15000);
    im.onload = () => { clearTimeout(safety);
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      try { res(c.toDataURL("image/jpeg", 0.86)); } catch { res(dataUrl); }
    };
    im.onerror = () => { clearTimeout(safety); res(dataUrl); };
    im.src = dataUrl;
  });
}

function splitState(raw) {
  const i = raw.indexOf("<state");
  if (i < 0) return { text: raw.trim(), state: null };
  const text = raw.slice(0, i).trim();
  let body = raw.slice(i).replace(/^<state>?/, "").replace(/<\/state>[\s\S]*$/, "");
  let state = null;
  try { state = parseJSONLoose(body); } catch { state = null; }
  return { text, state };
}

async function takeTurn(playerText) {

    entry.done = true; entry.text = text || "(The DM pauses. Try sending that again.)";
    applyState(state || {});
    if (!state) game.log.push({ id: uid(), role: "system", text: "The DM's bookkeeping didn't come through this turn — HP, items and rolls weren't updated." });
    saveGame(game);
    busy = false;

    maybeSummarize().finally(() => maybeUpdateSecrets());
  } catch (err) {
    game.log = game.log.filter(e => e.id !== entry.id);

/* ---- rolls ---- */
function resolveRollReq(r) {
  const p = game.pc;
  let notation = r.notation || "1d20", label = r.label || "Roll", bonus = null;
  const type = (r.type || "").toLowerCase();
  const skill = Object.keys(SKILLS).find(k => k.toLowerCase() === String(r.skill || "").toLowerCase());
  const ab = ABILITIES.find(a => a === String(r.ability || "").toUpperCase().slice(0, 3));
  if (type === "initiative") bonus = modOf(p.scores.DEX);
  else if (skill && type !== "attack" && type !== "damage") bonus = pcSkillBonus(p, skill);
  else if (type === "save" && ab) bonus = pcSaveBonus(p, ab);
  else if (type === "check" && ab) bonus = modOf(p.scores[ab]);
  if (bonus !== null) notation = "1d20" + (bonus >= 0 ? "+" : "") + bonus;
  const useAdv = /d20/.test(notation) && !/^\s*[2-9]d20/.test(notation) ? advMode : 0;
  const res = rollNotation(notation, useAdv);
  let tag = "";
  if (res.nat === 20 && /1d20|^d20/.test(notation.replace(/\s/g, ""))) tag = " — natural 20!";
  if (res.nat === 1 && /1d20|^d20/.test(notation.replace(/\s/g, ""))) tag = " — natural 1.";
  const advTxt = useAdv > 0 ? " with advantage" : useAdv < 0 ? " with disadvantage" : "";
  return { text: `${label}${advTxt}: ${res.detail} = ${res.total}${tag}`, total: res.total, nat: res.nat };
}
function doPendingRoll(id) {
  const r = game.pendingRolls.find(x => x.id === id);
  if (!r || r.done || busy) return;
  const out = resolveRollReq(r);
  showDice(out.total, out.nat, r.label || "Roll", out.nat != null);
  r.done = true; undoSnap = null;
  game.log.push({ id: uid(), role: "roll", text: out.text, nat: out.nat });
  advMode = 0; syncAdv();
  if (game.pendingRolls.every(x => x.done)) { game.pendingRolls = []; renderLog(); takeTurn(null); }
  else { saveGame(game); renderLog(); renderActionBar(); }
}
function freeRoll(notation, label) {
  const useAdv = /^1?d20([+-]\d+)?$/.test(notation.replace(/\s/g, "")) ? advMode : 0;
  const res = rollNotation(notation, useAdv);
  showDice(res.total, res.nat, label || notation, res.nat != null);
  const advTxt = useAdv > 0 ? " (advantage)" : useAdv < 0 ? " (disadvantage)" : "";
  game.log.push({ id: uid(), role: "roll", text: `${label || notation}${advTxt}: ${res.detail} = ${res.total}`, nat: res.nat });
  advMode = 0; syncAdv();
  saveGame(game); renderLog(); renderActionBar();
  const lr = $("#lastRoll"); if (lr) lr.textContent = res.total;
  return res;
}

function deathSave() {
  const p = game.pc; if (busy || p.hp > 0 || p.dead || p.stable) return;
  p.death = p.death || { s: 0, f: 0 };
  const r = rollNotation("1d20", advMode); advMode = 0; syncAdv();
  let out;
  if (r.nat === 20) { p.hp = 1; p.death = { s: 0, f: 0 }; p.conditions = p.conditions.filter(c => c !== "Unconscious"); out = "natural 20! " + p.name + " surges back to 1 HP"; }

function longRest() {

  p.hp = p.maxHp; p.tempHp = 0; p.hitDice = p.level; p.slotsUsed = {}; p.death = { s: 0, f: 0 }; p.stable = false;

    <div class="kv"><span>Proficiency bonus</span><b>${sgn(profBonus(p.level))} → ${sgn(profBonus(nl))}</b></div>
    ${slotMsg ? `<div class="kv"><span>Spell slots</span><b>${slotMsg}</b></div>` : ""}
    ${asi ? `<h3 style="margin-top:1rem">Ability Score Improvement</h3>

      <label class="f"><span>Second +1</span><select id="asi2">${ABILITIES.map(a => `<option value="${a}" ${a === CLASSES[p.cls].primary ? "selected" : ""}>${AB_NAMES[a]} (${p.scores[a]})</option>`).join("")}</select></label></div>` : ""}

    const ctx = game.log.filter(e => e.role === "dm").slice(-3).map(e => e.text).join("\n\n");
    let desc = game.location || "";
    if (haveTextAI()) desc = await aiComplete("You write short, purely visual prompts for fantasy map illustrations. No story, no character names, no text labels.",
      `Recent narration:\n${ctx}\nSetting: ${game.world.setting}\nWrite ONE paragraph (max 80 words) describing a hand-drawn regional overview map around the current location: settlements, roads, rivers, forests, mountains, ruins.`, 400);
    const id = await generateImage(`Hand-drawn fantasy regional map on aged parchment, ink and watercolor, top-down, compass rose, illustrated terrain, no readable text, no labels. ${desc}`, "wide");
    addImageEntry(id, `Region map — around ${game.location || "here"}`, "map");
    if (lastImageNote) toast(lastImageNote, 7000);
  } catch (e) { toast("Map failed: " + e.message, 7000); }
  imgBusy(false);
}

/* ---- voice ---- */
function speak(text) {
  if (!settings.tts || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#>]/g, ""));
  const v = speechSynthesis.getVoices().find(v => v.name === settings.voice); if (v) u.voice = v;
  u.rate = 1; speechSynthesis.speak(u);
}

async function importSave(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.game?.pc) throw new Error("That file isn't a Lanternlight save.");
    for (const [k, v] of Object.entries(data.images || {})) await IDB.put(k, v);
    if (data.table?.notes) addPlayerNotes(data.table.notes.map(n => n.t));
    saveGame(data.game); toast("Imported " + data.game.title); renderHome();
  } catch (e) { toast("Import failed: " + e.message, 5000); }
}
async function exportSave() {
  const images = {};
  for (const id of allImageIds(game)) { const v = await IDB.get(id); if (v) images[id] = v; }
  const blob = new Blob([JSON.stringify({ app: "lanternlight", version: 2, game, images, table: tableMem(), legend: LS.get("ll.legends", {})[game.id] || null })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = (game.title || "campaign").replace(/[^\w-]+/g, "_") + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function suggestOrder(cls) {
  const p = CLASSES[cls].primary;
  const tail = p === "STR" ? ["CON", "DEX", "WIS", "CHA", "INT"] : p === "DEX" ? ["CON", "WIS", "INT", "CHA", "STR"] : ["CON", "DEX", "WIS", "CHA", "INT", "STR"];
  return [p, ...tail.filter(a => a !== p)].slice(0, 6);
}
function autoAssign() {
  const order = suggestOrder(draft.cls), sorted = draft.pool.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
  order.forEach((ab, k) => draft.assign[ab] = sorted[k][1]);
  draft.plus2 = order[0]; draft.plus1 = order[1];
}
function newDraft() {
  draft = { step: 0, name: "", pronouns: "", species: "Human", cls: "Fighter", background: "Soldier", alignment: "Neutral Good", look: "",
    method: "array", pool: [15, 14, 13, 12, 10, 8], assign: {}, pb: { STR: 8, DEX: 8, CON: 8, INT: 8, WIS: 8, CHA: 8 }, plus2: "STR", plus1: "CON",
    skills: [], backstory: "", portraitId: null, features: "", party: [], partySize: 3,
    settingKey: "Classic high fantasy", settingCustom: "", tone: "Heroic adventure", hook: "", notes: "", title: "" };
  autoAssign();
}
function draftScores() {
  const out = {};
  ABILITIES.forEach(a => {
    const base = draft.method === "pointbuy" ? draft.pb[a] : (draft.pool[draft.assign[a]] ?? 8);
    out[a] = base + (draft.plus2 === a ? 2 : 0) + (draft.plus1 === a ? 1 : 0);
  });
  return out;
}
function bgSkills() { return BACKGROUNDS[draft.background] || []; }
function renderCreator() {
  view = "create"; setWhere("<b>New character</b>");
  const d = draft, st = d.step;

    <nav class="steps" aria-label="Character creation steps">${STEP_NAMES.map((n, i) => `<button class="${i === st ? "on" : ""}" data-act="step" data-i="${i}">${i + 1}. ${n}</button>`).join("")}</nav>

    </div></div>`;

function bindDraftInputs() {
  $$("[data-d]").forEach(el => {

    el.addEventListener(ev, () => {

      if (el.dataset.rerender) {

        if (k === "plus2" && draft.plus1 === draft.plus2) draft.plus1 = ABILITIES.find(a => a !== draft.plus2);
        if (k === "background") draft.skills = draft.skills.filter(s => !bgSkills().includes(s));

const opts = (arr, sel) => arr.map(v => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("");

/* ============ animated tactical map ============ */
const MAP_W = 20, MAP_H = 14;
const MAP_LEGEND = `"#" wall, "." floor, "," open ground, '"' tall grass/brush, "T" tree, "R" rocks/rubble (difficult terrain), "~" shallow water, "w" deep water, "D" door, "=" table/crates/furniture, "F" fire/torch/brazier (light source), "_" road/path, "B" bridge, "S" stairs, "X" pit/chasm, "L" lava, "*" treasure/altar, " " solid void`;
const BLOCKING = new Set(["#", "T", "w", "=", "F", "X", "L", " "]);
const THEMES = {
  dungeon: { floor: "#57524a", floor2: "#4d4841", ground: "#4a4538", wall: "#262320", wallTop: "#6e665b", grass: "#4f5a3a", dark: true, fx: "dust", planks: false },
  cave:    { floor: "#4b4540", floor2: "#433d38", ground: "#46403a", wall: "#1f1c1a", wallTop: "#5a5249", grass: "#3f4a33", dark: true, fx: "spores", planks: false },
  castle:  { floor: "#6b6861", floor2: "#5f5c56", ground: "#55523f", wall: "#2d2b29", wallTop: "#86817a", grass: "#50613b", dark: false, fx: "dust", planks: false },
  tavern:  { floor: "#7a5a3c", floor2: "#6d5035", ground: "#5b4a33", wall: "#2f2218", wallTop: "#8a6a48", grass: "#51613a", dark: false, fx: "dust", planks: true },
  ship:    { floor: "#80603f", floor2: "#71543a", ground: "#6a5238", wall: "#34261a", wallTop: "#9a7650", grass: "#51613a", dark: false, fx: "spray", planks: true },
  forest:  { floor: "#5c5238", floor2: "#544b33", ground: "#3f5a31", wall: "#2a2a22", wallTop: "#5d5b4c", grass: "#4f7038", dark: false, fx: "fireflies", planks: false },
  town:    { floor: "#6f6a60", floor2: "#666157", ground: "#58603f", wall: "#3b322b", wallTop: "#8a5b45", grass: "#5a7540", dark: false, fx: "dust", planks: false },
  swamp:   { floor: "#4b4a36", floor2: "#44432f", ground: "#3d4630", wall: "#262a20", wallTop: "#4d5540", grass: "#46583a", dark: false, fx: "fireflies", planks: false },
  snow:    { floor: "#c9d0d8", floor2: "#bcc4cd", ground: "#dfe5ec", wall: "#4a5360", wallTop: "#9aa6b5", grass: "#aab8a8", dark: false, fx: "snow", planks: false },
  desert:  { floor: "#b8955e", floor2: "#ad8a55", ground: "#caa56a", wall: "#6d5234", wallTop: "#b98d5c", grass: "#8f8a4d", dark: false, fx: "sand", planks: false }
};
const mapState = { canvas: null, ctx: null, tile: 32, stat: null, statKey: "", tokens: new Map(), parts: [], floats: [], raf: 0, last: 0, drag: null, sel: null, busy: false, imgs: new Map(), open: true, full: false };
const colName = x => String.fromCharCode(65 + x);
const cellName = (x, y) => colName(x) + (y + 1);
function hash2(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

function normalizeMap(j) {
  const w = MAP_W, h = MAP_H;
  let rows = Array.isArray(j.rows) ? j.rows.map(r => String(r)) : [];
  rows = rows.slice(0, h);
  while (rows.length < h) rows.push("#".repeat(w));
  rows = rows.map(r => (r + ".".repeat(w)).slice(0, w).replace(/[^#.,"TR~wD=F_BSXL* ]/g, "."));
  const theme = THEMES[j.theme] ? j.theme : "dungeon";
  const m = { name: j.name || "Battlefield", theme, dark: typeof j.dark === "boolean" ? j.dark : THEMES[theme].dark, w, h, rows, tokens: [], created: Date.now() };
  (j.tokens || []).forEach(t => addToken(m, t.name, t.kind, t.x, t.y));
  return m;
}
function tileAt(m, x, y) { return (x < 0 || y < 0 || x >= m.w || y >= m.h) ? " " : m.rows[y][x]; }
function freeCell(m, x, y) {
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return false;
  return !BLOCKING.has(tileAt(m, x, y)) && !m.tokens.some(t => t.x === x && t.y === y && !t.down);
}
function nearestFree(m, x, y) {
  x = clamp(Math.round(+x || 0), 0, m.w - 1); y = clamp(Math.round(+y || 0), 0, m.h - 1);
  if (freeCell(m, x, y)) return [x, y];
  for (let r = 1; r < 25; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    if (freeCell(m, x + dx, y + dy)) return [x + dx, y + dy];
  }
  return [x, y];
}
function tokenKind(name) {
  const who = game && findMember(name);
  if (who === "pc") return "pc";
  if (who) return "ally";
  return null;
}
function findToken(m, name) {
  const n = String(name || "").toLowerCase().trim();
  if (!n) return null;
  if (n === "player" || n === "pc") return m.tokens.find(t => t.kind === "pc");
  const exact = m.tokens.find(t => t.name.toLowerCase() === n); if (exact) return exact;
  const rx = str => new RegExp("^" + str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
  const fuzzy = m.tokens.filter(t => rx(n).test(t.name) || rx(t.name.toLowerCase()).test(n));
  return fuzzy.length === 1 ? fuzzy[0] : null;
}
function addToken(m, name, kind, x, y) {
  if (!name || findToken(m, name)) return;
  kind = tokenKind(name) || (["pc", "ally", "enemy", "npc"].includes(kind) ? kind : "enemy");
  if (kind === "pc") name = game.pc.name;
  const [fx, fy] = nearestFree(m, x ?? m.w / 2, y ?? m.h / 2);
  m.tokens.push({ id: uid(), name: String(name), kind, x: fx, y: fy });
}
// Keep the party and current enemies on the board
function syncTokens() {
  const m = game?.map; if (!m) return;
  const pcT = findToken(m, "pc") || (addToken(m, game.pc.name, "pc", 2, m.h - 3), findToken(m, "pc"));
  game.party.forEach((c, i) => { if (!findToken(m, c.name)) addToken(m, c.name, "ally", pcT.x + (i % 2 ? 1 : -1), pcT.y + (i > 1 ? 1 : 0)); });
  m.tokens = m.tokens.filter(t => t.kind !== "ally" || game.party.some(c => c.name === t.name));
  const enemies = game.combat?.enemies || [];
  enemies.forEach((e, i) => { if (!findToken(m, e.name)) addToken(m, e.name, "enemy", m.w - 3 - (i % 3), 2 + i); });
  m.tokens.forEach(t => {
    if (t.kind === "enemy") { const e = enemies.find(e => e.name === t.name); t.down = e ? e.hp <= 0 : !!t.down; }
    if (t.kind === "ally") { const c = game.party.find(c => c.name === t.name); t.down = c ? c.hp <= 0 : false; }
    if (t.kind === "pc") t.down = game.pc.hp <= 0;
  });
}
function mapPromptText(g) {
  const m = g.map; if (!m) return "";
  return `TACTICAL MAP "${m.name}" (${m.w} columns x ${m.h} rows; x = column 0–${m.w - 1} left to right, y = row 0–${m.h - 1} top to bottom; 1 square = 5 ft). Legend: ${MAP_LEGEND}.
${m.rows.map((r, i) => String(i).padStart(2, "0") + " " + r).join("\n")}
Tokens: ${m.tokens.map(t => `${t.name} (${t.kind}${t.down ? ", down" : ""}) at x${t.x},y${t.y}`).join("; ")}.
Whenever creatures move during combat or tense scenes, report their new squares in "moves". Respect walls and movement speed.`;
}

async function buildBattleMap(auto) {
  if (!haveTextAI() || mapState.busy || !game) return;
  mapState.busy = true; mapState.open = true; renderMapPanel();
  try {
    const ctx = game.log.filter(e => e.role === "dm").slice(-3).map(e => e.text).join("\n\n");
    const names = [game.pc.name + " (pc)", ...game.party.map(c => c.name + " (ally)"), ...(game.combat?.enemies || []).map(e => e.name + " (enemy)")];
    const t = await aiComplete("You design tactical D&D battle maps as character grids. Reply ONLY with valid JSON, no commentary.",
      `Current scene:\n${ctx || game.scene || game.location}\nLocation: ${game.location}\nSetting: ${game.world.setting}\n
Design a ${MAP_W}x${MAP_H} grid battle map of exactly this place. Make it interesting: cover, chokepoints, hazards, elevation-like features, light sources. Use this legend: ${MAP_LEGEND}.
Place these tokens sensibly (party together, enemies where the story puts them): ${names.join(", ")}.
JSON shape: {"name":"short place name","theme":"dungeon|cave|castle|tavern|ship|forest|town|swamp|snow|desert","dark":true or false (true if lit only by fires/torches),"rows":[${MAP_H} strings of exactly ${MAP_W} characters],"tokens":[{"name":"","kind":"pc|ally|enemy|npc","x":0,"y":0}]}`, 1800);
    const m = normalizeMap(parseJSONLoose(t));
    const old = game.map;
    game.map = m; game.mapTurn = game.turn; syncTokens();
    m.tokens.forEach(tk => { const o = old && findToken(old, tk.name); if (o) mapState.tokens.set(tk.id, { dx: o.x, dy: o.y }); });
    saveGame(game);
    if (!auto) toast("Battle map drawn. Drag your token to move.");
  } catch (e) { toast("Map failed: " + e.message, 6000); }
  mapState.busy = false; renderMapPanel();
}

/* ---- map panel DOM ---- */
function renderMapPanel() {
  const W = $("#mapwrap"); if (!W || !game) return;
  const m = game.map;
  W.classList.toggle("full", mapState.full);
  if (!m && !mapState.busy) { W.innerHTML = ""; W.dataset.key = ""; W.classList.add("hidden"); stopMap(); return; }
  W.classList.remove("hidden");
  const key = [m?.created, mapState.open, mapState.full, mapState.busy].join("|");
  if (W.dataset.key === key && (!m || !mapState.open || mapState.canvas?.isConnected)) return;
  W.dataset.key = key;
  W.innerHTML = `<div class="maphead">
      ${mapState.full ? "" : `<button class="btn sm ghost" data-act="maptoggle" aria-expanded="${mapState.open}">${mapState.open ? "Hide map" : "Show map"}</button>`}

/* ---- pointer: drag your token, tap others ---- */

/* ============ memory: codex, quests, chapters, table memory, legends ============ */
const CODEX_TYPES = { npc: "People", place: "Places", faction: "Factions", item: "Items", lore: "Lore & secrets", event: "Events" };
const tableMem = () => Object.assign({ notes: [], legends: true }, LS.get("ll.table", {}));

// Merge memories the DM (or the summarizer) reports. Returns entries that changed.

    if (!r || !r.name) return;

    let e = findEntry(g, r.name), isNew = false;
    if (!e) { e = { id: "c_" + uid(), type, name: String(r.name).slice(0, 80), summary: "", facts: [], attitude: "", status: "", pinned: false, aliases: [], firstTurn: g.turn, portraitId: null }; g.codex.push(e); isNew = true; }
    let touched = isNew;
    if (r.summary && r.summary !== e.summary) { e.summary = String(r.summary).slice(0, 300); touched = true; }
    (r.facts || []).forEach(f => { f = String(f).trim(); if (f && !e.facts.some(x => normName(x) === normName(f))) { e.facts.push(f.slice(0, 240)); touched = true; } });
    if (e.facts.length > 14) e.facts = e.facts.slice(-14);
    if (r.attitude && r.attitude !== e.attitude) { e.attitude = String(r.attitude); touched = true; }
    if (r.status && r.status !== e.status) { e.status = String(r.status); touched = true; }
    (r.aliases || []).forEach(a => { if (a && !e.aliases.includes(a)) e.aliases.push(String(a)); });

/* ---- pick what to put in front of the DM this turn ---- */
function mentions(text, e) {

}

  return g.codex.map(e => {

    if (normName(e.name) === normName(g.location)) s += 40;
    s += Math.max(0, 20 - (g.turn - (e.turn || 0)));   // recently touched

  const rel = relevantEntries(g, lastPlayer, leanMode() ? 9 : 16);
  const others = g.codex.filter(e => !rel.includes(e)).map(e => e.name);
  const active = g.quests.filter(q => q.status === "active");
  const done = g.quests.filter(q => q.status !== "active").slice(-6);
  const t = tableMem();
  let out = "CAMPAIGN MEMORY — this is canon. Stay consistent with it; reuse these NPCs, places and threads instead of inventing replacements.\n";
  out += rel.length ? rel.map(entryLine).join("\n") : "(nothing recorded yet)";
  if (others.length) out += `\nAlso known (ask yourself if they'd reappear): ${others.slice(-40).join(", ")}.`;
  out += `\nACTIVE QUESTS: ${active.length ? active.map(q => `${q.name}${q.notes.length ? " — " + q.notes[q.notes.length - 1] : ""}`).join("; ") : "none"}`;
  if (done.length) out += `\nFINISHED QUESTS: ${done.map(q => q.name + " (" + q.status + ")").join("; ")}`;
  if (g.chapters.length) out += `\nCHAPTERS SO FAR: ${g.chapters.map((c, i) => `${i + 1}. ${c.title}`).join(" / ")}`;

/* ---- legends: past heroes echo into new tales ---- */
function updateLegend(g) {

  L[g.id] = { name: g.pc.name, species: g.pc.species, cls: g.pc.cls, level: g.pc.level, titles: g.pc.titles || [], title: g.title, deeds: (g.chapters?.slice(-2).map(c => c.summary).join(" ") || g.summary || g.quest || "").slice(0, 260), updated: Date.now() };

/* ---- summarizing into chapters (and catching anything the DM forgot to record) ---- */
async function maybeSummarize(force) {

  const to = Math.max(from, g.log.length - keep);
  const chunk = g.log.slice(from, to).filter(e => ["dm", "player", "roll"].includes(e.role))
    .map(e => (e.role === "dm" ? "DM: " + e.text : e.role === "player" ? "PLAYER: " + e.text : "ROLL: " + e.text)).join("\n");
  if (!chunk) return;
  try {
    const t = await aiComplete("You are the memory keeper for a D&D campaign. Be factual and specific. Reply ONLY with valid JSON.",
      `Existing story summary:\n${g.summary || "(empty)"}\n\nKnown codex names: ${g.codex.map(e => e.name).join(", ") || "none"}\n\nNew events:\n${chunk}\n
Return JSON:
{"summary":"the updated whole-campaign summary, max 350 words: key events in order, promises, debts, mysteries, current goals",
"chapter_title":"evocative 2-5 word title for just these new events",
"chapter_summary":"2-4 sentences on just these new events",
"remember":[{"type":"npc|place|faction|item|lore|event","name":"","summary":"one line","facts":["specific new facts"],"attitude":"","status":""}],
"quests":[{"name":"","status":"active|done|failed","note":""}]}

    if (j.chapter_title) g.chapters.push({ title: String(j.chapter_title), summary: String(j.chapter_summary || ""), upTo: to, at: Date.now() });
    const ch = rememberEntries(g, j.remember), qs = applyQuests(g, j.quests);

    if (ch.some(c => c.isNew) || qs.length) memo(g, ch.filter(c => c.isNew), qs);

}

  const t = await aiComplete("You are the memory keeper for a D&D campaign. Reply ONLY with valid JSON.",
    `Story summary:\n${g.summary || "(none)"}\n\nRecent play:\n${text}\n\nExtract the campaign's memory. JSON: {"remember":[{"type":"npc|place|faction|item|lore|event","name":"","summary":"one line","facts":["specific facts"],"attitude":"","status":""}],"quests":[{"name":"","status":"active|done|failed","note":""}]}. Include every named character, place, faction, notable item, secret, promise and debt.`, 2200);

/* ---- highlight known names in the DM's text ---- */
function linkLore(html, g) {
  if (!g?.codex?.length) return html;
  const names = [];
  g.codex.forEach(e => [e.name, ...(e.aliases || [])].forEach(n => { if (n && n.length >= 3) names.push([n, e.id]); }));
  // people are often called by first name alone
  g.codex.filter(e => e.type === "npc").forEach(e => {
    const f = e.name.split(" ")[0];
    if (f.length >= 4 && f !== e.name && !/^(the|lord|lady|sir|captain|old|brother|sister)$/i.test(f) && g.codex.filter(x => x.name.split(" ")[0] === f).length === 1) names.push([f, e.id]);
  });
  names.sort((a, b) => b[0].length - a[0].length);
  const used = new Set();
  const parts = html.split(/(<[^>]+>)/);
  let insideLore = false;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p.startsWith("<")) { if (p.startsWith("<button")) insideLore = true; if (p.startsWith("</button")) insideLore = false; continue; }
    if (insideLore || !p) continue;
    let seg = p;
    for (const [n, id] of names) {
      if (used.has(id)) continue;
      const rx = new RegExp("(^|[^A-Za-z])(" + esc(n).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![A-Za-z])", "i");
      const m = seg.match(rx);
      if (m) {
        const at = m.index + m[1].length;
        seg = seg.slice(0, at) + `\u0000${id}\u0001${m[2]}\u0002` + seg.slice(at + m[2].length);
        used.add(id);
      }
    }
    parts[i] = seg.replace(/\u0000([^\u0001]+)\u0001([^\u0002]+)\u0002/g, (_, id, txt) => `<button class="lore" data-act="lore" data-id="${id}">${txt}</button>`);
  }
  return parts.join("");
}

/* ============ the DM's secret notebook (hidden from the player) ============ */
function ensureSecrets(g) {
  g.secrets = g.secrets || { dossiers: [], truths: [], villain: "", next: [], seeds: [], notes: [], turn: -99 };
  return g.secrets;
}
function addDmNotes(g, list) {
  const S = ensureSecrets(g);
  list.forEach(n => { n = String(n || "").trim(); if (n && !S.notes.includes(n)) S.notes.push(n.slice(0, 300)); });
  if (S.notes.length > 14) S.notes = S.notes.slice(-14);
}
function secretsText(g, stable) {
  const S = ensureSecrets(g);
  const has = S.dossiers.length || S.truths.length || S.villain || S.next.length || S.seeds.length || S.notes.length;
  if (!has) return "";
  // A stable order keeps the notebook cacheable between its updates.
  const dossiers = S.dossiers.slice(0, leanMode() ? 6 : 12);
  let out = "DM NOTEBOOK — PRIVATE. The player must never see this directly.\n";
  if (S.villain) out += `Villain & plan: ${S.villain}\n`;
  if (S.truths.length) out += `Hidden truths: ${S.truths.join(" | ")}\n`;
  if (dossiers.length) out += "Dossiers:\n" + dossiers.map(d => `- ${d.name}: seems ${d.face || "?"}; actually ${d.truth || "?"}; wants ${d.wants || "?"}${d.knows ? "; knows " + d.knows : ""}`).join("\n") + "\n";
  if (S.seeds.length) out += `Foreshadowing to pay off: ${S.seeds.join(" | ")}\n`;
  if (S.next.length) out += `Planned next beats (adapt to the player's choices): ${S.next.join(" | ")}\n`;
  if (S.notes.length) out += `Your notes: ${S.notes.join(" | ")}\n`;
  return out + "\n";
}
// Every few turns the helper model re-plans behind the screen.
let secretsBusy = false;
async function maybeUpdateSecrets(force) {
  const g = game; if (!g || secretsBusy || !haveTextAI()) return;
  const S = ensureSecrets(g);
  if (!force && g.turn - S.turn < (settings.replyLength === "short" ? 12 : 8) && S.turn >= 0) return;
  secretsBusy = true;
  try {
    const recent = g.log.filter(e => ["dm", "player"].includes(e.role)).slice(-12).map(e => (e.role === "dm" ? "DM: " : "PLAYER: ") + e.text).join("\n");
    const t = await aiComplete("You are the Dungeon Master's private planning assistant for a D&D 5e campaign. You work behind the DM screen: invent and maintain secrets that make the story coherent and surprising. Never contradict facts already established in play. Reply ONLY with valid JSON.",
      `Setting: ${g.world.setting}\nTone: ${g.world.tone}\nHook: ${g.world.hook || "(open)"}\nParty: ${g.pc.name} (level ${g.pc.level} ${g.pc.species} ${g.pc.cls})${g.party.length ? ", " + g.party.map(c => c.name + " the " + c.cls).join(", ") : ""}\n
Story summary:\n${g.summary || "(just started)"}\n\nKnown to the player (campaign memory):\n${g.codex.slice(-30).map(entryLine).join("\n") || "(nothing yet)"}\nActive quests: ${g.quests.filter(q => q.status === "active").map(q => q.name).join("; ") || "none"}\n\nRecent play:\n${recent || "(none)"}\n
Current private notebook:\n${JSON.stringify({ villain: S.villain, truths: S.truths, dossiers: S.dossiers, seeds: S.seeds, next: S.next, notes: S.notes })}\n
Update the notebook. Keep what still fits, fix what play has made impossible, fill gaps. Every important NPC or faction should have a dossier (a public face and a hidden truth; not everyone is evil — mix loyal allies, tragic figures, liars and schemers). Plan the next 3 beats, including at least one balanced encounter for a level ${g.pc.level} party of ${g.party.length + 1}, and one twist. Move seeds that have paid off out of "seeds".
JSON: {"villain":"who opposes the party, what they want, and their current move","truths":["mystery -> the real explanation"],"dossiers":[{"name":"","face":"how they appear","truth":"what's really going on","wants":"","knows":""}],"seeds":["planted clue -> intended payoff"],"next":["upcoming beat"],"notes":["keep useful existing notes"]}`, 1800);
    const j = parseJSONLoose(t);
    if (!game || game.id !== g.id) return;
    const arr = (x, n) => Array.isArray(x) ? x.map(v => typeof v === "string" ? v : JSON.stringify(v)).filter(Boolean).slice(0, n) : [];
    S.villain = String(j.villain || S.villain || "").slice(0, 500);
    S.truths = arr(j.truths, 8); S.seeds = arr(j.seeds, 8); S.next = arr(j.next, 4);
    if (Array.isArray(j.notes)) S.notes = arr(j.notes, 14);
    if (Array.isArray(j.dossiers)) S.dossiers = j.dossiers.filter(d => d && d.name).slice(0, 20).map(d => ({ name: String(d.name), face: String(d.face || ""), truth: String(d.truth || ""), wants: String(d.wants || ""), knows: String(d.knows || "") }));
    S.turn = g.turn; saveGame(g);
  } catch (e) { console.warn("notebook update skipped:", e.message); }
  finally { secretsBusy = false; }
}
function revealNotebook() {
  if (!confirm("This shows the DM's secret notebook — hidden motives, twists and upcoming plans. It will spoil the story. Open it anyway?")) return;
  const S = ensureSecrets(game);
  const list = (title, arr) => arr.length ? `<h3 style="margin-top:1rem">${title}</h3><ul class="notes">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";

    ${S.villain ? `<h3>Villain &amp; plan</h3><p>${esc(S.villain)}</p>` : ""}
    ${list("Hidden truths", S.truths)}
    ${S.dossiers.length ? `<h3 style="margin-top:1rem">Dossiers</h3>${S.dossiers.map(d => `<p><b>${esc(d.name)}</b><br><span class="small">Seems: ${esc(d.face)}<br>Really: ${esc(d.truth)}<br>Wants: ${esc(d.wants)}${d.knows ? "<br>Knows: " + esc(d.knows) : ""}</span></p>`).join("")}` : ""}
    ${list("Foreshadowing", S.seeds)}${list("Coming up", S.next)}${list("DM notes", S.notes)}

}

/* ============ the DM's craft guide (cached, so it costs almost nothing per turn) ============ */
const DM_GUIDE = `DM CRAFT GUIDE — follow these every turn.

STORYTELLING
- Frame each scene fast: where we are, one or two vivid sensory details (sound, smell, light, texture), and what's in motion right now. Then hand the moment to the player.
- Show, don't tell. Not "the town is scared" but "shutters slam as you pass; a mother pulls her child inside."
- Every scene needs stakes: something to gain, something to lose, and a clock (time, danger, or someone else acting).
- NPCs want something. Give each a voice tic, a visible detail, and an agenda. They lie, bargain, panic, joke, and remember how the party treated them.
- Fail forward: a failed roll changes the situation (a cost, a complication, a new danger) instead of stopping the story.
- Three-clue rule: any conclusion the player must reach should have at least three clues pointing to it, found in different ways.
- Give real choices with different costs. Avoid railroading; if the player goes somewhere unplanned, improvise using the notebook's people and threads.
- Consequences persist: burned bridges stay burned, saved villagers remember, stolen items are missed.
- Pace it: alternate tension and release. Cut boring travel with a single line unless something interesting happens.
- Combat should be vivid and quick: describe what the hit or miss looks like, give enemies tactics and morale (they flee, surrender or call for help), and use terrain.
- Humor comes from characters, not from mocking the player.
- End every reply on a moment of choice or a question, never on a summary.

WRITING STYLE
- Second person, present tense for the player ("You step into the hall"). Past tense only for backstory.
- Active voice. Strong specific verbs and nouns; few adverbs. Vary sentence length: mostly short and clear, an occasional long one for rhythm.
- Correct grammar, spelling and punctuation. Use American English. Put dialogue in double quotes with a new paragraph for each new speaker.
- No purple prose, no stacked adjectives, no clichés. Avoid these words and phrases: suddenly, a shiver runs down your spine, little did you know, tapestry, testament, palpable, air thick with, eyes widen, let out a breath you didn't know you were holding, echoes through, electric, ministrations.
- Don't start two replies in a row the same way. Don't repeat a description you've already given.
- Don't narrate the player's feelings or decisions. Don't ask "What do you do?" every time; vary the prompt or end on an NPC's line.
- Paragraphs of one to three sentences. Bold only the first mention of an important name.

5E QUICK RULES
- Difficulty Classes: very easy 5, easy 10, medium 15, hard 20, very hard 25. Passive checks equal 10 + the modifier.
- Advantage: roll two d20s and take the higher. Disadvantage: take the lower. They cancel each other out.
- Action economy: on its turn a creature gets one action, one bonus action (if a feature grants it), movement up to its speed, and one reaction per round.
- Cover: half cover +2 AC, three-quarters cover +5 AC. A critical hit (natural 20) doubles the damage dice.
- Common conditions: blinded, charmed, frightened, grappled, incapacitated, invisible, paralyzed, poisoned, prone, restrained, stunned, unconscious. Apply them precisely.
- Concentration: taking damage forces a Constitution save (DC 10 or half the damage, whichever is higher) or the spell ends.
- Rests: a short rest is 1 hour and lets characters spend hit dice. A long rest is 8 hours and restores HP and spell slots.
- Encounter building: easy fights barely scratch the party, medium ones drain some resources, hard ones are risky, deadly ones can kill. Aim for mostly medium, some hard, and deadly only when foreshadowed and escapable. For level 1-2 parties, a few weak monsters (CR 1/8 to 1/2) at a time is plenty.
- XP by challenge rating: CR 0 10, 1/8 25, 1/4 50, 1/2 100, 1 200, 2 450, 3 700, 4 1100, 5 1800. Split XP among the whole party, then award the player their share.
- Treasure: modest coins and one useful mundane or consumable item per encounter at low levels; permanent magic items are rare rewards for big milestones.

KEEP IT EFFICIENT
- Put only fields that changed this turn in the state block. Leave out empty lists.
- Keep suggestions to 3 short options of at most 6 words each.
- Don't repeat the character sheet or the table state back to the player.`;

// Reply length presets (output costs the most, so this is the biggest money lever)
const LENGTHS = {
  short: { words: "70–120", max: 1100, label: "Short (cheapest)" },
  normal: { words: "100–180", max: 1600, label: "Normal" },
  long: { words: "160–260", max: 2200, label: "Long (richest)" }
};
const replyLength = () => LENGTHS[settings.replyLength] || LENGTHS.normal;

/* ============ spending meter ============ */
// Prices per million tokens, from Anthropic's published pricing. Unknown models count tokens only.
function modelPrice(model) {
  const m = String(model || "").toLowerCase();
  if (/sonnet-5/.test(m)) return [2, 10];
  if (/haiku-4-5/.test(m)) return [1, 5];
  return null;
}
function recordUsage(model, u) {
  if (!u) return;
  const inTok = u.input_tokens || 0, write = u.cache_creation_input_tokens || 0, read = u.cache_read_input_tokens || 0, out = u.output_tokens || 0;
  const U = LS.get("ll.usage", { cost: 0, since: Date.now(), models: {} });
  const r = U.models[model] = U.models[model] || { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, calls: 0 };
  r.input += inTok; r.output += out; r.cacheRead += read; r.cacheWrite += write; r.calls++;
  const p = modelPrice(model);
  if (p) U.cost += (inTok * p[0] + write * p[0] * 1.25 + read * p[0] * 0.1 + out * p[1]) / 1e6;
  try { localStorage.setItem("ll.usage", JSON.stringify(U)); } catch {}
  const el = $("#spendLine"); if (el) el.textContent = spendText();
}
function spendText() {
  const U = LS.get("ll.usage", null);
  if (!U) return "";
  return `About $${U.cost.toFixed(2)} spent on Claude since ${new Date(U.since).toLocaleDateString()}.`;
}
function usageTable() {
  const U = LS.get("ll.usage", null);
  if (!U || !Object.keys(U.models).length) return `<p class="small muted">Nothing spent yet on this device.</p>`;
  const saved = Object.entries(U.models).reduce((t, [m, r]) => { const p = modelPrice(m); return t + (p ? r.cacheRead * p[0] * 0.9 / 1e6 : 0); }, 0);
  return `<p class="small">${esc(spendText())} Caching saved you about $${saved.toFixed(2)}.</p>
    <div style="overflow-x:auto"><table class="usage"><tr><th>Model</th><th>Calls</th><th>New input</th><th>Cached input</th><th>Output</th></tr>
    ${Object.entries(U.models).map(([m, r]) => `<tr><td>${esc(m)}</td><td>${r.calls}</td><td>${r.input.toLocaleString()}</td><td>${(r.cacheRead + r.cacheWrite).toLocaleString()}</td><td>${r.output.toLocaleString()}</td></tr>`).join("")}</table></div>
    <p class="small muted">Numbers are tokens (about ¾ of a word each). This is an estimate; your Anthropic Console shows the exact bill.</p>`;
}

/* ============ sync across devices (stored in a private GitHub Gist) ============ */
// Your GitHub account is the "account": campaigns, Codex, portraits and preferences are saved to a secret gist.
// API keys are never synced — paste them once on each device.
const SYNC_DESC = "Lanternlight sync (do not edit)";
const TOKEN_URL = "https://github.com/settings/tokens/new?scopes=gist&description=Lanternlight%20sync";
const syncCfg = () => LS.get("ll.sync", null);
const syncOn = () => !!syncCfg()?.gistId;
let syncing = false, syncAgain = false, syncTimer = null, syncMsg = "", syncBad = false;

async function gh(path, opt = {}) {
  const c = syncCfg();
  const res = await fetchRetry("https://api.github.com" + path, { ...opt, headers: { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + c.token, ...(opt.body ? { "Content-Type": "application/json" } : {}) } }, 2)
    .catch(e => { if (/401|Bad credentials/i.test(e.message)) throw new Error("GitHub didn't accept the token. Make a new one (with the gist box checked) and sign in again."); throw e; });
  return res.status === 204 ? null : res.json();
}
function setSyncStatus(msg, bad) {
  syncMsg = msg; syncBad = !!bad;
  $$(".syncstatus").forEach(el => { el.textContent = msg; el.classList.toggle("sync-bad", !!bad); el.classList.toggle("sync-ok", !bad); });
}
function syncStatusText() {
  const c = syncCfg(); if (!c?.gistId) return "";
  if (syncMsg) return syncMsg;
  return c.last ? `Synced with GitHub (${c.login}) ${timeAgo(c.last)}.` : `Signed in to GitHub as ${c.login}.`;
}
function timeAgo(t) { const s = (Date.now() - t) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : new Date(t).toLocaleDateString(); }
function scheduleSync(ms = 15000) { if (!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), ms); }

async function connectSync(token) {
  token = cleanKey(token);
  if (!token) throw new Error("Paste your GitHub token first.");
  LS.set("ll.sync", { token });
  try {
    const me = await gh("/user");
    let gist = null;
    for (let page = 1; page <= 5 && !gist; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      gist = list.find(x => x.description === SYNC_DESC);
      if (list.length < 100) break;
    }
    if (!gist) gist = await gh("/gists", { method: "POST", body: JSON.stringify({ description: SYNC_DESC, public: false, files: { "index.json": { content: JSON.stringify({ v: 1, campaigns: {}, deleted: {} }) } } }) });
    LS.set("ll.sync", { token, gistId: gist.id, login: me.login, last: 0 });
  } catch (e) { localStorage.removeItem("ll.sync"); throw e; }
  await syncNow();
}
function signOutSync() { localStorage.removeItem("ll.sync"); syncMsg = ""; }

// Portraits first, then the newest pictures, up to about 3 MB per campaign.
async function collectImages(g) {
  const first = [g.pc.portraitId, ...g.party.map(c => c.portraitId), ...(g.codex || []).map(e => e.portraitId)].filter(Boolean);
  const rest = allImageIds(g).filter(id => !first.includes(id)).reverse();

async function syncNow() {
  if (!syncOn()) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSyncStatus("Syncing…");
  let pulled = 0, pushed = 0;
  try {
    const c = syncCfg();
    const gist = await gh(`/gists/${c.gistId}`);
    const files = gist.files || {};
    const readFile = async name => {
      const f = files[name]; if (!f) return null;
      if (f.truncated || f.content == null) { const r = await fetch(f.raw_url); if (!r.ok) throw new Error("Couldn't download " + name); return r.text(); }
      return f.content;
    };
    const remote = JSON.parse((await readFile("index.json")) || "{}");
    remote.campaigns = remote.campaigns || {}; remote.deleted = remote.deleted || {};
    const push = {}; let indexChanged = false;

    // 1. deletions, both directions
    const localDel = LS.get("ll.deleted", {});
    for (const [id, t] of Object.entries(localDel)) {
      if (!remote.deleted[id] || remote.deleted[id] < t) {
        remote.deleted[id] = t; delete remote.campaigns[id]; indexChanged = true;
        ["c_", "i_"].forEach(p => { if (files[p + id + ".json"]) push[p + id + ".json"] = null; });
      }
    }
    for (const [id, t] of Object.entries(remote.deleted)) {
      const loc = listSaves().find(s => s.id === id);
      if (loc && loc.updated <= t) { if (game?.id === id) { game = null; view = "home"; } await deleteGame(id, t); pulled++; }
    }
    // 2. pull campaigns that are newer on GitHub
    for (const [id, meta] of Object.entries(remote.campaigns)) {
      const loc = listSaves().find(s => s.id === id);
      if (loc && meta.updated <= loc.updated) continue;
      if (game?.id === id && busy) continue;              // don't swap a campaign mid-reply
      const txt = await readFile(`c_${id}.json`); if (!txt) continue;
      const g = JSON.parse(txt);
      const itxt = await readFile(`i_${id}.json`);
      if (itxt) for (const [k, v] of Object.entries(JSON.parse(itxt))) if (!(await IDB.get(k))) { await IDB.put(k, v); }
      saveGame(g, { keepTime: true, noSync: true }); pulled++;
      if (game?.id === id) { game = g; if (view === "play") { renderPlayAll(); toast("Picked up where you left off on your other device."); } }
    }
    // 3. push campaigns that are newer here
    for (const loc of listSaves()) {
      const r = remote.campaigns[loc.id];
      if (r && r.updated >= loc.updated) continue;
      const g = (game?.id === loc.id) ? game : await loadGame(loc.id); if (!g) continue;
      const imgs = await collectImages(g), h = hashKeys(imgs);
      push[`c_${loc.id}.json`] = { content: JSON.stringify(g) };
      if (!r || r.imgHash !== h || !files[`i_${loc.id}.json`]) push[`i_${loc.id}.json`] = { content: JSON.stringify(imgs) };
      remote.campaigns[loc.id] = { ...loc, updated: g.updated, imgHash: h }; indexChanged = true; pushed++;
    }
    // 4. "About you" notes and legends: merge both ways
    const t = tableMem(), rt = remote.table || { notes: [], legends: true };
    const notes = [...(rt.notes || []), ...t.notes].filter((n, i, a) => a.findIndex(x => normName(x.t) === normName(n.t)) === i).slice(-30);
    const forgotten = new Set([...(rt.forgotten || []), ...(t.forgotten || [])]);
    const merged = { notes: notes.filter(n => !forgotten.has(n.id)), legends: (LS.get("ll.tableUpdated", 0) >= (remote.tableUpdated || 0)) ? t.legends : rt.legends, forgotten: [...forgotten].slice(-100) };
    if (JSON.stringify(merged.notes) !== JSON.stringify(t.notes) || merged.legends !== t.legends) LS.set("ll.table", merged);
    if (JSON.stringify(merged) !== JSON.stringify(rt)) { remote.table = merged; remote.tableUpdated = Date.now(); indexChanged = true; }
    const L = LS.get("ll.legends", {}), RL = remote.legends || {};
    for (const [id, v] of Object.entries(RL)) if (!remote.deleted[id] && (!L[id] || L[id].updated < v.updated)) L[id] = v;
    for (const id of Object.keys(L)) if (remote.deleted[id]) delete L[id];
    LS.set("ll.legends", L);
    if (JSON.stringify(L) !== JSON.stringify(RL)) { remote.legends = L; indexChanged = true; }
    // 5. preferences (never keys)
    const prefsLocalT = LS.get("ll.prefsUpdated", 0);
    if (remote.prefs && (remote.prefsUpdated || 0) > prefsLocalT) {
      SYNCED_PREFS.forEach(k => { if (k in remote.prefs) settings[k] = remote.prefs[k]; });
      LS.set("ll.settings", settings); LS.set("ll.prefsUpdated", remote.prefsUpdated);
    } else if (prefsLocalT > (remote.prefsUpdated || 0)) {
      remote.prefs = Object.fromEntries(SYNCED_PREFS.map(k => [k, settings[k]])); remote.prefsUpdated = prefsLocalT; indexChanged = true;
    }

    if (indexChanged || Object.keys(push).length) {
      push["index.json"] = { content: JSON.stringify(remote) };
      await gh(`/gists/${c.gistId}`, { method: "PATCH", body: JSON.stringify({ files: push }) });
    }
    c.last = Date.now(); LS.set("ll.sync", c);
    syncMsg = "";
    setSyncStatus(`Synced with GitHub (${c.login}) just now${pulled ? `, ${pulled} campaign${pulled > 1 ? "s" : ""} updated from another device` : ""}.`);
    if (pulled && view === "home") renderHome();
  } catch (e) {
    setSyncStatus("Sync didn't work: " + e.message, true);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(2000); }
  }
}
